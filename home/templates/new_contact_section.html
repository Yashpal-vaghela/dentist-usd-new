{% load static %}
<link href="{% static 'css/new_contact_section.css' %}?v=1.0" rel="stylesheet" />

<section class="contact-section">
    <div class="contact-container">

        <!-- LEFT CARD -->
        <div class="contact-left">

            <div class="contact-content">

                <div class="contact-tag">
                    <span class="dot"></span>
                    Contact
                </div>

                <h2>
                    Start Your Journey as <br class="mobile-br"> Ultimate
                    <br class="desktop-br">
                    Smile Designer
                </h2>

                <p>
                    Hear from dentists who have integrated Ultimate Smile Design into
                    their practice and experienced remarkable improvements.
                </p>

            </div>

            <div class="contact-image">
                <img src="{% static 'images/hand_magic.png' %}" alt="hand_magic">
            </div>

        </div>


        <!-- RIGHT CARD -->
        <div class="contact-right">

            <form method="POST" action="{% url 'homePage' %}">
                {% csrf_token %} 

                <div class="field">
                    <label>Full Name</label>
                    <div class="input-wrapper">
                        <span class="field-icon">
                            <img src="{% static 'images/full.svg' %}" alt="name icon">
                        </span>
                        <input type="text" id="full_name" name="full_name" class="form_input" required autocomplete="off">
                    </div>
                </div>

                <div class="field">
                    <label>Email</label>
                    <div class="input-wrapper">
                        <span class="field-icon">
                            <img src="{% static 'images/emailnew.svg' %}" alt="email icon">
                        </span>
                        <input type="email" id="email" name="email" class="form_input" required autocomplete="off">
                    </div>
                </div>

                <div class="field">
                    <label>Mobile Number</label>
                    <div class="input-wrapper">
                        <span class="field-icon">
                            <img src="{% static 'images/mobileno.svg' %}" alt="phone icon">
                        </span>
                        <input type="text" id ="phone" name="phone" class="form_input" required autocomplete="off">
                    </div>
                </div>

                <div class="field">
                    <label>City</label>
                    <div class="input-wrapper">
                        <span class="field-icon">
                            <img src="{% static 'images/city.svg' %}" alt="city icon">
                        </span>
                        <input type="text" id="city" name="city" class="form_input" required autocomplete="off">
                    </div>
                </div>

                <div class="field field-message">
                    <label>Message</label>
                    <div class="input-wrapper">
                        <span class="field-icon">
                            <img src="{% static 'images/messagenew.svg' %}" alt="message icon">
                        </span>
                        <textarea id="message" name="message" class="form_input" required autocomplete="off"></textarea>
                    </div>
                </div>

                <div class="captcha">
                    <div class="g-recaptcha" data-sitekey="{{ RECAPTCHA_SITE_KEY }}"></div>
                </div>

                <button class="contact-form-btn" type="submit">Contact Now</button>

            </form> 

        </div>

    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<script src="{% static 'js/recaptcha-api.js' %}" async defer></script>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const contactForm = document.querySelector(".contact-right form");
    if (contactForm) {
      contactForm.addEventListener("submit", function (e) {
        let recaptchaResponse = "";
        if (typeof grecaptcha !== "undefined") {
          recaptchaResponse = grecaptcha.getResponse();
        }
        if (!recaptchaResponse || recaptchaResponse.trim() === "") {
          e.preventDefault(); // Stop form submission and prevent page refresh!
          Swal.fire({
            icon: "error",
            title: "Verification Required",
            text: "Please complete the reCAPTCHA verification before submitting.",
            confirmButtonText: "OK"
          });
        }
      });
    }
  });
</script>

{% if messages %} {% for message in messages %}
<script>
  Swal.fire({
    icon: "{{ message.tags }}" === "error" ? "error" : "success",
    title: "{{ message.tags }}" === "error" ? "Verification Failed" : "Thank You!",
    text: "{{ message }}",
    showConfirmButton: "{{ message.tags }}" === "error",
    timer: "{{ message.tags }}" === "error" ? null : 2500,
  });
</script>
{% endfor %} {% endif %}
