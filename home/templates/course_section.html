<!-- Lightbox HTML -->
<div id="imgLightbox" class="img-lightbox-overlay" tabindex="-1">
    <button id="imgLightboxClose" class="img-lightbox-close" aria-label="Close lightbox">&times;</button>
    <div class="img-lightbox-inner">
        <img id="imgLightboxImg" src="" alt="">
    </div>
</div>

<!-- All java script here -->
<script>
    var _lightboxScrollY = 0;

    function openLightbox(src, alt) {
        var scrollbarWidth = window.innerWidth - document.documentElement.clientWidth;
        document.body.style.paddingRight = scrollbarWidth + 'px';
        document.documentElement.style.overflow = 'hidden';
        document.body.style.overflow = 'hidden';
        document.getElementById('imgLightboxImg').src = src;
        document.getElementById('imgLightboxImg').alt = alt || '';
        document.getElementById('imgLightbox').classList.add('active');
        document.getElementById('imgLightboxClose').focus();
    }

    function closeLightbox() {
        document.getElementById('imgLightbox').classList.remove('active');
        document.getElementById('imgLightboxImg').src = '';
        document.documentElement.style.overflow = '';
        document.body.style.overflow = '';
        document.body.style.paddingRight = '';
    }

    document.addEventListener('click', function (e) {
        if (e.target.closest('#imgLightboxClose')) { closeLightbox(); return; }
        if (e.target.id === 'imgLightbox') { closeLightbox(); }
    });

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && document.getElementById('imgLightbox').classList.contains('active'))
            closeLightbox();
    });

    document.addEventListener("DOMContentLoaded", function () {
        gsap.registerPlugin(ScrollTrigger);
        ScrollTrigger.config({
            ignoreMobileResize: true
        });
        const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        if (isTouchDevice) {
            ScrollTrigger.normalizeScroll({
                allowNestedScroll: true
            });
        }

        const items = document.querySelectorAll(".gallery-item");
        const tl = gsap.timeline({
            scrollTrigger: {
                trigger: ".gallery-perspective",
                start: "top top",
                end: "+=4000",
                scrub: 1.5,
                pin: true,
                anticipatePin: 1,
                invalidateOnRefresh: true,
            },
        });

        items.forEach((item, index) => {
            const zInitial = -2000 - index * 500;
            const zFinal = 2000;
            gsap.set(item, {
                z: zInitial,
                opacity: 1,
                scale: 2,
            });

            tl.to(
                item,
                {
                    z: zFinal,
                    opacity: 1,
                    ease: "power1.inOut",
                },
                index * 0.12,
            ).to(
                item,
                {
                    opacity: 0,
                    duration: 0.3,
                    ease: "power2.in",
                },
                index * 0.12 + 0.6,
            );
        });

        // ── Gold 'END' SVG scroll animation ────────────────────────────────
        const svgContainer = document.querySelector(".gallery-svg-container");
        const svgPaths = document.querySelectorAll("#headlines path");
        svgPaths.forEach(path => {
            const length = path.getTotalLength();
            path.style.strokeDasharray = length;
            path.style.strokeDashoffset = length;
        });

        const lastItemIndex = items.length - 1;
        const svgStartTime = lastItemIndex * 0.12 + 0.3;

        tl.to(svgContainer, {
            opacity: 1,
            duration: 0.6,
            ease: "power2.out"
        }, svgStartTime);

        svgPaths.forEach((path, pathIndex) => {
            tl.to(path, {
                strokeDashoffset: 0,
                duration: 0.8,
                ease: "power1.inOut"
            }, svgStartTime + 0.1 + pathIndex * 0.15);
        });

        tl.fromTo(svgContainer, {
            scale: 0.8,
        }, {
            scale: 1.1,
            duration: 1.5,
            ease: "power2.out"
        }, svgStartTime);

        // items.forEach((item) => {
        //   gsap.to(item, {
        //     y: "random(-30, 30)",
        //     x: "random(-30, 30)",
        //     rotation: "random(-4, 4)",
        //     duration: "random(3, 5)",
        //     repeat: -1,
        //     yoyo: true,
        //     ease: "sine.inOut",
        //   });
        // });

        // if (window.innerWidth > 1024) {
        //   window.addEventListener("mousemove", (e) => {
        //     const x = (e.clientX / window.innerWidth - 0.5) * 10;
        //     const y = (e.clientY / window.innerHeight - 0.5) * 10;

        //     gsap.to(".gallery-container", {
        //       rotationY: x,
        //       rotationX: -y,
        //       duration: 0.8,
        //       ease: "power2.out",
        //     });
        //   });
        // }

        document.getElementById('galleryContainer').addEventListener('click', function (e) {
            var clientX = e.clientX;
            var clientY = e.clientY;
            var matchedItems = [];

            items.forEach(function (item) {
                var opacity = parseFloat(window.getComputedStyle(item).opacity) || 0;
                var zVal = parseFloat(gsap.getProperty(item, "z")) || 0;
                if (opacity > 0.1 && zVal < 1100) {
                    var rect = item.getBoundingClientRect();
                    if (clientX >= rect.left && clientX <= rect.right &&
                        clientY >= rect.top && clientY <= rect.bottom) {
                        matchedItems.push(item);
                    }
                }
            });

            if (matchedItems.length > 0) {
                matchedItems.sort(function (a, b) {
                    var zA = parseFloat(gsap.getProperty(a, "z")) || 0;
                    var zB = parseFloat(gsap.getProperty(b, "z")) || 0;
                    return zB - zA;
                });
                var frontItem = matchedItems[0];
                var img = frontItem.querySelector('img');
                if (img) openLightbox(img.src, img.alt);
            }
        });

        window.addEventListener("orientationchange", () => {
            setTimeout(() => {
                ScrollTrigger.refresh(true);
            }, 250);
        });

    });
</script>
